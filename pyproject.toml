[project]
name = "policy-tree"
version = "0.1.0"
description = "Insurer medical policy scraper and LLM-structured criteria tree explorer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pypdf>=4.3",
    "pdfplumber>=0.11",
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
